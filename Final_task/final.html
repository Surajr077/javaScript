<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="final.css">
</head>

<body>
    <div class="container">

        <header>
            <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
            <div class="date-time">
                <span id="today"></span>
                <span id="time"></span>
            </div>
        </header>

        <section class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search employee...">
                <button id="searchBtn">Search</button>
            </div>

            <div class="filter-buttons">
                <button class="department-btn active" data-department="All">All</button>
                <button class="department-btn" data-department="IT">IT</button>
                <button class="department-btn" data-department="HR">HR</button>
                <button class="department-btn" data-department="Finance">Finance</button>
                <button class="department-btn" data-department="Marketing">Marketing</button>
            </div>
        </section>

        <div id="message"></div>

        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Highest Paid</h3>
                <p id="highestEmployee">-</p>
            </div>
        </section>

        <section class="sorting">
            <label for="sortSelect">Sort Employees:</label>

            <select id="sortSelect">
                <option value="">Select</option>
                <option value="nameAsc">Name ↑</option>
                <option value="nameDesc">Name ↓</option>
                <option value="ageAsc">Age ↑</option>
                <option value="ageDesc">Age ↓</option>
                <option value="salaryAsc">Salary ↑</option>
                <option value="salaryDesc">Salary ↓</option>
            </select>
        </section>

        <section>
            <h2>Employees</h2>
            <div
                id="employeeContainer"
                class="employee-container">
            </div>
        </section>

        <section class="add-section">
            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter name">
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                </div>


                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>


                <div class="form-group">
                    <label>Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR </option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" id="salary" placeholder="Enter salary">
                </div>

                <button type="submit" class="add-btn"> Add Employee</button>

            </form>
            <div id="errorMessage"></div>
        </section>
    </div>

    <script src="final.js"></script>

</body>
</html>
